services:
  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - D:/Lightroom/revelado/web:/data/photos
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://trashpanda:trashpanda_password@db:5432/trashpanda
      PHOTO_STORAGE_ROOT: /data/photos
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_USER: ""
      SMTP_PASS: ""
    depends_on:
      - db
      - mailpit
    command: sh -c "npx prisma migrate deploy && npm run start"

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: trashpanda
      POSTGRES_USER: trashpanda
      POSTGRES_PASSWORD: trashpanda_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:v1.30.6
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
